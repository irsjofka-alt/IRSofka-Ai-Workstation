# irsofka-station-core — the workstation daemon: native window + local HTTP API + pty host.
[package]
name = "irsofka-station-core"
version = "2.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["irsjofka-alt"]
# Aset vendor di assets/ tetap di bawah lisensinya masing-masing, lihat
# THIRD_PARTY_NOTICES.md di akar repo.

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
wry = "0.57.0"
tao = "0.37.1"
