<!DOCTYPE html>
<!--
  station.html — the human-facing record of the workstation: what was asked, what was done, what came out.
  Read-only by design. Every number here is derived by PostgreSQL from the action log, so nothing on this
  page was typed by an AI describing its own work. Data comes from /api/station; the console stays at /.
  Layout borrows from a game wiki: grouped sidebar, tabbed feed, cards that open into evidence.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irsofka AI Station</title>
<style>
  :root {
    --bg: #0a0e13;
    --rail: #0d131b;
    --panel: #121a24;
    --panel-2: #17212e;
    --line: #202d3c;
    --ink: #e6edf3;
    --ink-dim: #8b9bb0;
    --ink-faint: #5b6a7f;
    --accent: #4fd1c5;
    --amber: #f0b429;
    --rose: #f2617a;
    --violet: #a78bfa;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    /* Spacing scale. Before this file had colour and type variables but every gap was a literal,
       which is how one view ends up tighter than the next for no reason anyone can name. */
    --sp-1: 6px;
    --sp-2: 10px;
    --sp-3: 14px;
    --sp-4: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 236px 1fr;
  }

  /* ---------- sidebar ---------- */
  aside {
    background: linear-gradient(180deg, #101823 0%, var(--rail) 100%);
    border-right: 1px solid var(--line);
    padding: 22px 0 28px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { padding: 0 20px 18px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font: 600 17px/1.2 var(--serif); letter-spacing: 2.4px; text-transform: uppercase; }
  .brand p { margin: 6px 0 0; font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-faint); }
  .group { padding: 20px 12px 0; }
  .group > h2 {
    margin: 0 8px 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .nav {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; border-left: 2px solid transparent; border-radius: 0 8px 8px 0;
    color: var(--ink-dim); padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .nav:hover { color: var(--ink); background: #141d29; }
  .nav.on { color: var(--ink); background: #16212e; border-left-color: var(--accent); }
  .nav.soon { color: var(--ink-faint); cursor: default; }
  .nav.soon:hover { background: none; color: var(--ink-faint); }
  .nav i { font-style: normal; width: 18px; text-align: center; opacity: .85; }
  .nav em {
    margin-left: auto; font-style: normal; font-size: 9.5px; letter-spacing: .8px;
    text-transform: uppercase; color: var(--ink-faint); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px;
  }

  /* ---------- main ---------- */
  main { padding: 0 30px 70px; min-width: 0; }
  header { padding: 30px 0 16px; border-bottom: 1px solid var(--line); }
  .crumb { font-size: 12px; color: var(--ink-faint); letter-spacing: .4px; }
  .crumb b { color: var(--ink-dim); font-weight: 500; }
  h2.title { margin: 12px 0 4px; font: 600 26px/1.15 var(--serif); letter-spacing: .3px; }
  .sub { margin: 0; color: var(--ink-dim); font-size: 13px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 13px; min-width: 76px; }
  .stat span { display: block; font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .7px; }
  .stat strong { display: block; font-size: 18px; font-weight: 600; font-family: var(--mono); }
  .stat.bad strong { color: var(--rose); }
  .stat.good strong { color: var(--accent); }

  nav.tabs {
    display: flex; flex-wrap: wrap; gap: 7px; align-items: center; padding: 16px 0 18px;
    position: sticky; top: 0; z-index: 5;
    background: rgba(10,14,19,.93); backdrop-filter: blur(8px);
  }
  .chip {
    background: var(--panel); color: var(--ink-dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-faint); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #06202a; font-weight: 600; }
  #q {
    margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); padding: 6px 11px; font-size: 13px; min-width: 210px;
  }
  #q:focus { outline: none; border-color: var(--accent); }

  /* ---------- cards ---------- */
  #feed { display: flex; flex-direction: column; gap: 11px; }
  article {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: grid; grid-template-columns: 74px 1fr; gap: 16px; cursor: pointer;
  }
  article:hover { border-color: #2e4054; background: var(--panel-2); }
  article.live { border-left: 2px solid var(--accent); }
  article.fail { border-left: 2px solid var(--rose); }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
  .when em { display: block; font-style: normal; color: var(--ink-dim); margin-top: 3px; }
  .ask { margin: 0 0 9px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); background: #0d141d;
         border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .tag.state { color: var(--accent); border-color: #1d4b48; }
  .tag.state.open { color: var(--amber); border-color: #4a3a13; }
  .tag.bad { color: var(--rose); border-color: #4d2230; }
  .tag.model { color: var(--violet); border-color: #322a4d; }
  .hint { color: var(--ink-faint); font-size: 11px; margin-left: auto; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .file { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); background: #0d141d;
          border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .file.media { color: var(--amber); border-color: #4a3a13; }
  .file i { font-style: normal; color: var(--ink-faint); }

  .detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  article.open { background: var(--panel-2); }
  article.open .detail { display: block; }
  .detail h4 {
    margin: 0 0 7px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px;
    color: var(--ink-faint); font-weight: 700;
  }
  .answer { font-size: 14px; background: #0d141d; border-left: 2px solid var(--accent);
            border-radius: 0 8px 8px 0; padding: 10px 13px; margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; }
  .answer i { display: block; font-style: normal; color: var(--ink-faint); font-size: 11px; margin-top: 7px; }
  .step { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); padding: 2.5px 0;
          white-space: pre-wrap; word-break: break-word; }
  .step b { color: var(--ink-faint); font-weight: 400; margin-right: 9px; }
  .more { color: var(--ink-faint); font-size: 12px; margin-top: 5px; }

  /* ---------- artefacts view ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 11px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
  .box h3 { margin: 0 0 3px; font: 500 14px/1.35 var(--mono); word-break: break-all; }
  .box p { margin: 0; font-size: 12px; color: var(--ink-faint); }
  .box .bar { height: 3px; border-radius: 3px; background: #1b2836; margin-top: 10px; overflow: hidden; }
  .box .bar > i { display: block; height: 100%; background: var(--accent); }
  .box .bar > i.low { background: var(--amber); }
  .box .bar > i.none { background: var(--rose); }
  .box .num { font: 600 20px/1.2 var(--mono); color: var(--ink); margin: 6px 0 2px; }
  .box .num.muted { color: var(--ink-faint); font-size: 15px; font-weight: 500; }
  .box .why { font-size: 11.5px; color: var(--ink-faint); margin-top: 8px; line-height: 1.45; }
  .box .reset { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); margin-top: 8px; }

  /* Roles & verifier (F8.3). Form fields are deliberately narrow: the only values an
     operator may type here are ones the validator can check against a real CLI or meter. */
  .erow { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
  .erow h3 { margin: 0 0 2px; font: 500 14px/1.3 var(--mono); }
  .erow .kind { font-size: 11px; color: var(--ink-faint); margin: 0 0 10px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 9px; }
  .field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .7px;
                 color: var(--ink-faint); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; box-sizing: border-box; background: #0d141d; border: 1px solid var(--line);
    color: var(--ink); font-family: var(--mono); font-size: 12.5px; padding: 6px 8px; border-radius: 7px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  /* Antrean yang bisa dijawab. Pilihan adalah radio karena bentuknya memang satu keputusan;
     kolom teks dibiarkan bebas karena jawaban manusia tidak selalu salah satu label kita. */
  .field textarea {
    width: 100%; box-sizing: border-box; background: #0d141d; border: 1px solid var(--line);
    color: var(--ink); font-family: var(--mono); font-size: 12.5px; padding: 6px 8px;
    border-radius: 7px; min-height: 54px; resize: vertical;
  }
  .field textarea:focus { outline: none; border-color: var(--accent); }
  .opts { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 2px; }
  .opts label { font-family: var(--mono); font-size: 12px; color: var(--ink); display: flex;
                gap: 7px; align-items: baseline; }
  .wins { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 3px; }
  .wins label { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); display: flex; gap: 5px; align-items: center; }
  .savebar { display: flex; gap: 10px; align-items: center; margin: 4px 0 2px; flex-wrap: wrap; }
  .btn { background: #0d141d; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 8px;
         padding: 7px 14px; font: 500 12.5px var(--mono); cursor: pointer; }
  .btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06202a; font-weight: 600; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .note { font-size: 12px; color: var(--ink-faint); }
  .findings { display: flex; flex-direction: column; gap: 6px; }
  .finding { border-left: 2px solid var(--rose); background: #0d141d; padding: 8px 11px; border-radius: 0 8px 8px 0;
             font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
  .finding.warn { border-left-color: var(--amber); }
  .finding b { font-family: var(--mono); font-weight: 500; color: var(--ink); display: block; font-size: 11.5px;
               margin-bottom: 3px; word-break: break-all; }
  .rtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .rtable th { text-align: left; font-family: var(--serif); font-size: 10px; font-weight: 500;
               text-transform: uppercase; letter-spacing: .7px;
               color: var(--ink-faint); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
  .rtable td { padding: 7px 10px 7px 0; border-bottom: 1px solid #101a24; vertical-align: top; }
  .rtable td.mono { font-family: var(--mono); font-size: 12px; }
  .rtable td .why { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  /* ---------- Dashboard: kokpit proyek (3 kolom) ----------
     `.card` sebelumnya dibangun di delapan tempat di JavaScript dan tidak punya satu aturan CSS
     pun — itu sebabnya tab ini terlihat "berantakan": setiap kartu adalah div transparan dengan
     heading ukuran browser di atas latar gelap. Akar masalahnya warna dan ritme, bukan isinya. */
  #dash, .dash { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .dash-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .dash-head { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 0 2px;
               font: 700 10px/1 var(--serif); letter-spacing: 1.4px; text-transform: uppercase;
               color: var(--ink-faint); }
  .dash-head b { color: var(--ink-dim); font-weight: 700; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 15px; min-width: 0;
  }
  .card:hover { border-color: #2b3d51; }
  .card > h3 { margin: 0 0 2px; font: 500 13.5px/1.35 var(--serif); letter-spacing: .2px; }
  .card > p { margin: 0; font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
  .card .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12px;
              padding: 3px 0; border-bottom: 1px dashed #16212e; }
  .card .kv:last-child { border-bottom: 0; }
  .card .kv span { color: var(--ink-faint); }
  .card .kv strong { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink);
                     text-align: right; word-break: break-word; }
  /* Sakelar satu kata, tiga keadaan. Tiga checkbox terpisah adalah tiga laporan tentang satu hal. */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px;
         background: #0c1218; border: 1px solid var(--line); border-radius: 10px; }
  .seg button {
    background: none; border: 0; border-radius: 7px; color: var(--ink-faint); cursor: pointer;
    font: 600 11.5px/1 var(--mono); letter-spacing: .6px; padding: 8px 4px; text-transform: uppercase;
  }
  .seg button:hover { color: var(--ink); background: #131d28; }
  .seg button.on { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .seg button.on[data-mode="SEMI"] { color: var(--amber); box-shadow: inset 0 0 0 1px #4a3a13; }
  .seg button.on[data-mode="ON"] { color: var(--accent); box-shadow: inset 0 0 0 1px #1d4b48; }
  .seg button[disabled] { opacity: .4; cursor: default; }
  .ledger { margin-top: 9px; font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }
  /* Header proyek: judul, subjek, dan pedoman — bagian "station" dari kalimat operator. */
  .proj { border-left: 2px solid var(--accent); }
  .proj .path { font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
                word-break: break-all; margin-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .guide {
    font-family: var(--mono); font-size: 11px; color: var(--ink-dim); background: #0d141d;
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer;
  }
  .guide:hover { color: var(--ink); border-color: var(--ink-faint); }
  .guide.on { color: var(--accent); border-color: #1d4b48; background: #10201f; }
  .guide.can { color: var(--violet); border-color: #322a4d; }
  /* Terkunci: tidak ada pointer, tidak ada hover — benda ini tidak bisa diklik, dan layar tidak
     boleh berpura-pura bisa. */
  .guide.locked { cursor: default; color: var(--violet); border-color: #322a4d; background: #10131f; }
  .guide.locked:hover { color: var(--violet); border-color: #322a4d; }
  .compose textarea { min-height: 74px; }
  .reply { font-size: 11.5px; font-family: var(--mono); margin-top: 8px; color: var(--ink-faint);
           word-break: break-word; white-space: pre-wrap; }
  .reply.bad { color: var(--rose); }
  .reply.good { color: var(--accent); }
  /* Kolom 3: kartu keputusan. Ini satu-satunya tempat halaman ini meminta sesuatu dari manusia. */
  .card.decision { border-left: 2px solid var(--amber); }
  .card.span { grid-column: 1 / -1; }
  .card.qrow { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  .card.qrow .t { font-size: 12.5px; color: var(--ink); min-width: 0; word-break: break-word; }
  .card.qrow .who { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
  .card.decision .q { margin: 0 0 9px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap;
                      word-break: break-word; }
  .card.decision .why { font-size: 11.5px; color: var(--ink-faint); margin: 0 0 9px; line-height: 1.5; }
  .card.answered { border-left: 2px solid var(--accent); opacity: .92; }
  .fold { border: 1px solid var(--line); border-radius: 11px; background: #0d1319; }
  .fold > summary { cursor: pointer; list-style: none; padding: 9px 13px; font-size: 11.5px;
                    color: var(--ink-faint); font-family: var(--mono); letter-spacing: .3px; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary:hover { color: var(--ink-dim); }
  .fold[open] > summary { border-bottom: 1px solid var(--line); }
  .fold .body { padding: 11px 13px; display: flex; flex-direction: column; gap: 11px; }
  @media (max-width: 1180px) {
    body { grid-template-columns: 200px 1fr; }
    #dash { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 780px) {
    body { grid-template-columns: 1fr; }
    aside { position: static; height: auto; }
    #dash { grid-template-columns: 1fr; }
  }

  .empty { color: var(--ink-faint); text-align: center; padding: 56px 0; font-size: 14px; }
  footer { margin-top: 24px; padding-top: 13px; border-top: 1px solid var(--line);
           color: var(--ink-faint); font-size: 12px; display: flex; justify-content: space-between; gap: 16px; }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>Irsofka</h1>
    <p>AI Station</p>
  </div>
  <div class="group">
    <h2>Workspace</h2>
    <button class="nav on" data-view="dashboard"><i>▦</i> Dashboard</button>
  </div>
  <div class="group">
    <h2>Today</h2>
    <button class="nav" data-view="feed"><i>≡</i> Activity feed</button>
    <button class="nav" data-view="files"><i>▤</i> Artefacts</button>
    <button class="nav" data-view="treasury"><i>¤</i> Treasury</button>
  </div>
  <div class="group">
    <h2>Team</h2>
    <button class="nav" data-view="roles"><i>◎</i> Roles &amp; verifier</button>
    <button class="nav soon" data-soon="models"><i>◈</i> Models &amp; VRAM<em>soon</em></button>
  </div>
  <div class="group">
    <h2>System</h2>
    <button class="nav soon" data-soon="engines"><i>⚙</i> Engines<em>soon</em></button>
    <button class="nav soon" data-soon="backup"><i>↺</i> Backups<em>soon</em></button>
    <a class="nav" href="/" style="text-decoration:none"><i>▸</i> Open console</a>
  </div>
</aside>

<main>
  <header>
    <div class="crumb">AI Station / <b id="crumb">Activity feed</b></div>
    <h2 class="title" id="title">What happened</h2>
    <p class="sub" id="sub">Loading…</p>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="work">Did work</button>
    <button class="chip" data-f="talk">Talk only</button>
    <button class="chip" data-f="fail">Had failures</button>
    <button class="chip" data-f="open">In progress</button>
    <input id="q" type="search" placeholder="search commands and files…">
  </nav>

  <div id="feed"></div>

  <footer>
    <span>Derived from PostgreSQL. No number on this page was typed by an AI.</span>
    <span id="stamp"></span>
  </footer>
</main>

<script>
(function () {
  "use strict";
  var filter = "all", query = "", view = "dashboard", data = { posts: [], totals: {} };

  // Setiap view adalah halaman yang berbeda secara mental. Tanpa ini, reload atau deep link
  // (#roles) melanjutkan posisi scroll view sebelumnya dan operator mendarat di tengah
  // laporan tanpa tahu ada apa di atasnya.
  if (window.history && "scrollRestoration" in window.history) {
    window.history.scrollRestoration = "manual";
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function clock(iso) { return iso ? String(iso).slice(11, 16) : ""; }
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  // The feed holds the last 80 entries, which crosses days. Showing a bare clock made
  // yesterday evening read like it had not happened yet.
  function when(iso) {
    var s = String(iso || "");
    if (!s) return "";
    var t = new Date();
    var now = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") +

  function timeLeft(epoch) {
    if (!epoch) return "no window set";

    if (sec <= 0) return "expired " + Math.floor(-sec / 60) + "m ago";
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return (h ? h + "h " : "") + m + "m left";
  }

  var apBusySend = false;

     pengirim sakelar dengan satu nama adalah cara membuat yang mana yang berjalan tergantung
     pada siapa mendeklarasikan terakhir. */
  function dashSwitch(mode, btn) {
    var box = document.getElementById("switch-reply");
    if (box) { box.textContent = "mengirim " + mode + "…"; box.className = "reply"; }
    apBusySend = true;
    var body = { mode: mode.toLowerCase(), by: "operator-gui" };
    if (mode === "SEMI") body.reason = "SEMI dari Dashboard — operator mengawasi";
    postJson("/api/autopilot", body).then(function (res) {
      apBusySend = false;
      if (!box) { render(); return; }
      showReply(box, res);
      box.className = "reply " + (res.status === 200 ? "good" : "bad");

  function decisionCard(d) {
    var card = el("div", "card decision");
    card.appendChild(el("h3", null, "#" + d.id + (d.item_id ? " · item #" + d.item_id : "") + " · " + (d.weight || "")));
    card.appendChild(el("p", "q", d.question || ""));
    if (d.note) card.appendChild(el("p", "why", "catatan: " + d.note));
    var opts;
    try { opts = JSON.parse(d.options || "[]"); } catch (e) { opts = []; }
    if (opts.length) {
      var box = el("div", "opts");
      opts.forEach(function (o, i) {
        var lab = el("label");
        var r = el("input");
        r.type = "radio";
        r.name = "dec" + d.id;
        r.value = o.label || String(i);
        r.addEventListener("change", function () {
          drafts["d" + d.id] = o.label || String(i);
          var t = card.querySelector("textarea");
          if (t) { t.value = drafts["d" + d.id]; }

        lab.appendChild(r);
        lab.appendChild(document.createTextNode((o.label || "?") + (o.evidence ? " — " + o.evidence : "")));
        box.appendChild(lab);
      });
      card.appendChild(box);
    } else {
      card.appendChild(el("p", "why", "tanpa pilihan — pertanyaan ini diajukan mesin karena ia melewati ambang, dan ia tidak mengarang opsi untuk ambang yang baru saja dilanggarnya."));
    }

  function renderDecideView() {
    /* Poll 10 detik tidak boleh merebut formulir yang sedang diketik: operator yang kehilangan
       jawabannya di tengah kalimat akan menulisnya dua kali, dan yang kedua masuk ke baris yang
       sudah dijawab — menolak itu benar, tapi penyebabnya tidak perlu ada di sini. */
    if (document.querySelector("#feed input:focus, #feed textarea:focus, #feed select:focus")) {
      return;
    }
    document.getElementById("title").textContent = "What waits for a person";
    document.getElementById("crumb").textContent = "Human Decide";
    document.getElementById("tabs").style.display = "none";
    var box = document.getElementById("stats");
    var feed = document.getElementById("feed");

    if (!ap) {
      box.textContent = "";
      feed.textContent = "";
      document.getElementById("sub").textContent = "reading the work order…";
      feed.appendChild(el("p", "empty", apBusy ? "asking work_order.py for the current state…" : "not loaded yet"));
      loadAutopilot();
      return;
    }
    if (ap.error) {
      box.textContent = "";
      feed.textContent = "";
      document.getElementById("sub").textContent = "the daemon could not answer";
      feed.appendChild(el("p", "empty", ap.error));
      if (ap.off_paths) {
        ap.off_paths.forEach(function (p) { feed.appendChild(el("p", "note", "still works: " + p)); });
      }
      return;
    }

    var state = ap.autopilot || {}, night = ap.night || {}, limits = ap.limits || {};
    var drain = ap.drain || {};
    var waiting = (ap.decisions_open || []).length + (ap.human_queue || []).length;
    var on = state.mode === "ON";

    box.textContent = "";
    [["switch", state.mode || "UNKNOWN", on ? "good" : (state.mode ? "" : "bad")],
     ["window", state.mode === "ON" ? timeLeft(state.until_epoch) : "not running", ""],
     ["items this run", (state.items_done || 0) + " / " + (state.item_budget || "—"), ""],
     ["breaker", night.ok ? "closed" : "TRIPPED", night.ok ? "" : "bad"],
     ["waiting for you", waiting, waiting ? "bad" : ""]].forEach(function (r) {
      var card = el("div", "stat " + r[2]);
      card.appendChild(el("span", null, r[0]));
      card.appendChild(el("strong", null, String(r[1])));
      box.appendChild(card);
    });

    document.getElementById("sub").textContent =
      (night.ok
        ? "the loop may claim the next item"
        : "the loop will not claim anything: " + (night.why || []).join(", ")) +
      " · read from " + (ap.engine || "the work order") + " just now";

    feed.textContent = "";
    feed.appendChild(head("The switch, as recorded"));
    var switchBox = el("div", "card");
    switchBox.appendChild(el("h3", null, "Autopilot is " + (state.mode || "UNKNOWN")));
    [["changed by", state.changed_by || "—"],
     ["ON since", state.on_epoch ? new Date(Number(state.on_epoch) * 1000).toLocaleString() : "—"],
     ["ends", state.mode === "ON" ? timeLeft(state.until_epoch) : "—"],
     ["item budget", String(state.item_budget || "—") + " · items done " + (state.items_done || 0)],
     ["last off reason", state.off_reason || "—"],
     ["hard limits", "failures " + limits.max_failures + " · items " + limits.max_items +
       " · lease " + limits.lease_seconds + "s · resumes " + limits.max_resume]].forEach(function (r) {
      var p = el("p", null);
      p.appendChild(el("b", null, r[0] + ": "));
      p.appendChild(document.createTextNode(r[1]));
      switchBox.appendChild(p);
    });
    feed.appendChild(switchBox);

    /* Kontrol sakelar. `mode` menjawab siapa yang memegang mesin dan boleh diklik dari sini;
       `level` menjawab seberapa jauh tangan boleh bergerak dan tidak punya tombol di sini —
       menaiki tangga butuh terminal manusia (`arm` menolak tanpa /dev/tty, itu diukur, bukan
       gaya). Menulis CONTINUE ke pane karena seseorang menekan Save adalah jalur lain, dan ia
       hanya lahir dari satu klik, bukan dari timer. */
    feed.appendChild(head("The switch, as control"));
    var ctl = el("div", "card");
    ctl.appendChild(el("h3", null,
      "mode " + (state.mode || "UNKNOWN") + " · hand at " + (drain.level || "UNKNOWN")));
    var win = numField("window minutes", 240, 1, 1440);
    var bud = numField("item budget", Number(state.item_budget) || 12, 1, 200);
    var whyIn = el("input");
    whyIn.type = "text";
    whyIn.placeholder = "reason (written into the ledger, optional)";
    var whyField = el("div", "field");
    whyField.appendChild(el("label", null, "reason"));
    whyField.appendChild(whyIn);
    [win.box, bud.box, whyField].forEach(function (f) { ctl.appendChild(f); });
    var reply = el("div");
    var btnOn = el("button", "btn primary", state.mode === "ON" ? "Renew the window" : "Turn ON");
    var btnOff = el("button", "btn", "Turn OFF");
    function sendSwitch(mode, button) {
      button.disabled = true;
      var body = { mode: mode, by: "operator-gui", reason: whyIn.value || null };
      if (mode === "on") {
        body.minutes = Number(win.input.value);
        body.budget = Number(bud.input.value);
      }
      postJson("/api/autopilot", body).then(function (res) {
        button.disabled = false;
        showReply(reply, res);
        ap = null;
        loadAutopilot();
      }).catch(function (e) {
        button.disabled = false;
        reply.textContent = "tidak ada balasan dari daemon: " + e;
      });
    }
    btnOn.addEventListener("click", function () { sendSwitch("on", btnOn); });
    btnOff.addEventListener("click", function () { sendSwitch("off", btnOff); });
    var row = el("div", "row");
    row.appendChild(btnOn);
    row.appendChild(btnOff);
    ctl.appendChild(row);
    ctl.appendChild(reply);
    ctl.appendChild(el("p", "note",
      "OFF works without the AI's cooperation, and so does this button: " +
      (ap.off_paths || ["tombol ini",
        "ai-station autopilot off",
        "systemctl --user stop irsofka-autopilot.timer",
        "python3 ~/.ai-station/tools/work_order.py disarm"]).join(" · ")));
    ctl.appendChild(el("p", "note",
      "ON does not raise the hand. Nothing types CONTINUE into a pane until the ladder is armed from " +
      "a terminal — `ai-station drain arm resume`, which refuses to run without a controlling TTY, and " +
      "this page has no button for it on purpose. Answering a question below is the one keystroke that " +
      "comes from you, not from the loop."));
    feed.appendChild(ctl);

    if (!night.ok && (night.why || []).length) {
      feed.appendChild(head("Why the breaker is open"));
      var whyCard = el("div", "card");
      (night.why || []).forEach(function (w) {
        var p = el("p", null);
        p.appendChild(el("b", null, "· "));
        p.appendChild(document.createTextNode(w));
        whyCard.appendChild(p);
      });
      if (night.tree_dirty === true) {
        whyCard.appendChild(el("p", "note",
          "the fix is to name the files and commit or revert them by hand — never a wholesale discard: " +
          "an uncommitted change belongs to whichever engine was mid-way through writing it."));
      }
      if (night.tree_dirty === null) {
        whyCard.appendChild(el("p", "note",
          "git could not be read. UNKNOWN is not clean — the same asymmetry that makes the call-worker cut safe."));
      }
      feed.appendChild(whyCard);
    }

    feed.appendChild(head("Decisions waiting on you"));
    listOrNull(feed, ap.decisions_open, function (d) {
      var c = el("div", "card");
      var esc = d.state !== "OPEN";
      c.appendChild(el("h3", null, d.question || "untitled question"));
      c.appendChild(el("p", esc ? "note" : null,
        esc ? "every resolver rung was tried and none of them settled this — it is here because "
              + "the machines could not, not because someone chose to skip you"
            : "no engine has dispatched this yet"));
      var opts = [];
      try { opts = JSON.parse(d.options || "[]"); } catch (e) { opts = []; }
      var draft = drafts[d.id] || (drafts[d.id] = { choice: null, text: "" });
      var group = "dec" + d.id;
      if (opts.length) {
        var optBox = el("div", "opts");
        opts.forEach(function (o) {
          var label = (o && typeof o === "object") ? (o.label || "(no label)") : String(o);
          var lab = el("label");
          var rb = el("input");
          rb.type = "radio";
          rb.name = group;
          rb.value = label;
          rb.checked = draft.choice === label;
          rb.addEventListener("change", function () { draft.choice = label; });
          lab.appendChild(rb);
          lab.appendChild(document.createTextNode(label));
          optBox.appendChild(lab);
          if (o && typeof o === "object") {
            optBox.appendChild(el("p", "note", "   evidence: " + (o.evidence || "not measured") +
                                  " · cost: " + (o.cost || "not measured")));
          }
        });
        c.appendChild(optBox);
      } else {
        c.appendChild(el("p", "note", "no options were recorded — answer in the box below"));
      }
      var ansField = el("div", "field");
      ansField.appendChild(el("label", null, "your answer"));
      var ta = el("textarea");
      ta.placeholder = draft.choice ? "chosen: " + draft.choice + " — or write your own"
                                   : "what you decide, in your own words";
      ta.value = draft.text;
      ta.addEventListener("input", function () { draft.text = ta.value; });
      ansField.appendChild(ta);
      c.appendChild(ansField);
      var aReply = el("div");
      var save = el("button", "btn primary", "Save answer");
      save.addEventListener("click", function () {
        var answer = (ta.value || "").trim() || (draft.choice || "");
        if (!answer) {
          aReply.textContent = "nothing sent: pick an option or write the answer";
          return;
        }
        save.disabled = true;
        postJson("/api/decide", { id: d.id, answer: answer, by: "operator-gui" })
          .then(function (res) {
            save.disabled = false;
            showReply(aReply, res);
            if (res.json && res.json.ok) {
              delete drafts[d.id];
              ap = null;
              loadAutopilot();
            }
          })
          .catch(function (e) { save.disabled = false; aReply.textContent = "tidak ada balasan: " + e; });
      });
      var bar = el("div", "savebar");
      bar.appendChild(save);
      bar.appendChild(el("span", "note",
        d.item_id ? ("unblocks item #" + d.item_id + " · delivered to its own engine when that pane is provably resting")
                  : "this question names no item · answering it records the decision but wakes nothing"));
      c.appendChild(bar);
      c.appendChild(aReply);
      c.appendChild(el("p", "note",
        "weight " + (d.weight || "—") + " · state " + d.state +
        (d.rung_used ? " · rung " + d.rung_used : "") + " · opened " +
        new Date(Number(d.created_epoch) * 1000).toLocaleString() +
        " · nothing was answered by a substitute engine"));
      return c;
    });

    /* Riwayat jawaban. Baris yang sudah dijawab memang keluar dari antrean menunggu — tapi kalau
       ia hilang sama sekali, operator tidak bisa membedakan "sudah saya jawab" dari "tidak pernah
       ada", dan itu mengundang jawaban kedua pada pertanyaan yang sama. */
    feed.appendChild(head("Answered — and by whom"));
    listOrNull(feed, ap.decisions_answered, function (d) {
      var c = el("div", "card");
      c.appendChild(el("h3", null, d.question || "untitled question"));
      c.appendChild(el("p", null, "→ " + (d.answer || "(no answer recorded)")));
      c.appendChild(el("p", "note",
        (d.state || "—") + " by " + (d.answered_by || d.model_id || "—") +
        (d.rung_used ? " · rung " + d.rung_used : "") +
        (d.item_id ? " · item #" + d.item_id : "") +
        " · " + new Date(Number(d.resolved_epoch) * 1000).toLocaleString()));
      return c;
    });

    feed.appendChild(head("Items that crossed a measured threshold"));
    listOrNull(feed, ap.human_queue, function (h) {
      var c = el("div", "card");
      c.appendChild(el("h3", null, "#" + h.id + " — " + h.title));
      c.appendChild(el("p", null, h.escalation_reason || "no reason recorded"));
      c.appendChild(el("p", "note",
        "phase " + (h.phase || "—") + " · waiting because a threshold is a number read when the item runs, " +
        "not a number remembered from the conversation that motivated it"));
      return c;
    });

    feed.appendChild(head("Engines that may be stalled"));
    listOrNull(feed, ap.stalled, function (s) {
      var c = el("div", "card");
      c.appendChild(el("h3", null, "#" + s.id + " — " + s.title));
      c.appendChild(el("p", null,
        "held by " + (s.claimed_by || "?") + " · lease " + timeLeft(s.lease_epoch) +
        " · resumes used " + (s.resume_count || 0)));
      c.appendChild(el("p", "note",
        "a list is not a decision to type: CONTINUE needs the pane readable AND unchanged before anything is sent"));
      return c;
    });

    feed.appendChild(head("What the queue offers next"));
    var qCard = el("div", "card");
    if (ap.next) {
      qCard.appendChild(el("h3", null, "#" + ap.next.id + " — " + ap.next.title));
      qCard.appendChild(el("p", null,
        "status " + ap.next.status + " · phase " + (ap.next.phase || "—") +
        " · depends on " + (ap.next.depends_on || "nothing")));
    } else {
      qCard.appendChild(el("p", "empty",
        "nothing is offerable — an empty queue means stop, not find something"));
    }
    var counts = (ap.per_status || []).map(function (r) { return r.status + " " + r.n; }).join(" · ");
    qCard.appendChild(el("p", "note", "quest_tasks by status: " + (counts || "none")));
    feed.appendChild(qCard);
  }

  function renderRolesView() {
    document.getElementById("title").textContent = "Who is on the team";
    document.getElementById("crumb").textContent = "Roles & verifier";
    document.getElementById("tabs").style.display = "none";
    var box = document.getElementById("stats");
    box.textContent = "";
    var feed = document.getElementById("feed");
    feed.textContent = "";

    if (!master) {
      document.getElementById("sub").textContent = "reading the master data…";
      feed.appendChild(el("p", "empty", masterBusy ? "validating against the CLIs and the meter…" : "not loaded yet"));
      loadMaster();
      return;
    }
    if (master.error) {
      document.getElementById("sub").textContent = "the daemon could not answer";
      feed.appendChild(el("p", "empty", master.error));
      return;
    }

    var report = masterBlocked || master.report || {};
    var evidence = report.evidence || {};
    var registry = (master.document && master.document.engines && master.document.engines.engines) || {};
    var dispatch = master.dispatch || {};
    var live = ((master.report || {}).evidence || {});
    var can = Object.keys(dispatch).filter(function (k) { return dispatch[k].can_dispatch; }).length;

    [["engines", Object.keys(registry).length, ""],
     ["can be dispatched now", can + " / " + Object.keys(dispatch).length,
      can ? "good" : "bad"],
     ["blocking errors", (report.errors || []).length, (report.errors || []).length ? "bad" : ""],
     ["warnings", (report.warnings || []).length, ""],
     ["model ids read from CLIs",
      Object.keys(evidence.model_lists || {}).map(function (k) {
        return k + " " + evidence.model_lists[k].length;
      }).join(" · ") || "none", ""]].forEach(function (r) {
      var card = el("div", "stat " + r[2]);
      card.appendChild(el("span", null, r[0]));
      card.appendChild(el("strong", null, r[1]));
      box.appendChild(card);
    });

    document.getElementById("sub").textContent =
      "the model named here is the one read out of config at the moment of use — " +
      "nothing on this page is remembered from a previous session";

    var team = null;
    var slots = (master.document && master.document.slots) || {};
    (slots.teams || []).forEach(function (t) { if (t.id === slots.active_team) team = t; });

    if (team) {
      feed.appendChild(head("Roles in " + team.id));
      var table = el("table", "rtable");
      var thead = el("thead");
      var hr = el("tr");
      ["role", "engine key", "model resolved now", "would it start?"].forEach(function (h) {
        hr.appendChild(el("th", null, h));
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      var tbody = el("tbody");
      (team.roles || []).forEach(function (role) {
        var tr = el("tr");
        var resolved = (master.report.resolved || {})[role.role_id] || {};
        var d = dispatch[resolved.registry_key || ""] || null;
        var first = el("td", null);
        first.appendChild(el("b", null, role.role_id));
        if (role.title) {
          var why = el("span", "why");
          why.textContent = role.title;
          first.appendChild(why);
        }
        tr.appendChild(first);
        tr.appendChild(el("td", "mono", resolved.registry_key || "— not bound"));
        var mt = el("td", "mono", resolved.model || (role.model || "—"));
        if (resolved.registry_key && resolved.model) {
          var src = el("span", "why");
          src.textContent = "from config/engines.json → " + resolved.registry_key;
          mt.appendChild(src);
        }
        tr.appendChild(mt);
        var st = el("td", null);
        if (!resolved.registry_key) {
          st.appendChild(el("span", "why", "team description only — this role dispatches nothing"));
        } else if (d && d.can_dispatch) {
          st.appendChild(el("span", "tag state", "yes · " + (d.model || "")));
        } else {
          st.appendChild(el("span", "tag bad", "no"));
          var why2 = el("span", "why");
          why2.textContent = (d && d.reason) || "not in the registry";
          st.appendChild(why2);
        }
        tr.appendChild(st);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      feed.appendChild(table);
    }

    feed.appendChild(head("Engine registry — edit and save"));
    Object.keys(registry).sort().forEach(function (key) {
      feed.appendChild(engineEditor(key, registry[key], live));
    });

    var bar = el("div", "savebar");
    var save = el("button", "btn primary" + (masterBusy ? " waiting" : ""),
      masterBusy ? "working…" : "Save & validate");
    save.disabled = !!masterBusy;
    save.addEventListener("click", saveMaster);
    var reload = el("button", "btn", "Reload from disk");
    reload.disabled = !!masterBusy;
    reload.addEventListener("click", function () {
      master = null; masterMsg = null; masterBlocked = null; loadMaster();
    });
    bar.appendChild(save);
    bar.appendChild(reload);
    if (masterMsg) {
      bar.appendChild(el("span", "note", masterMsg.text));
    }
    feed.appendChild(bar);

    if ((report.errors || []).length) {
      feed.appendChild(head("Refused — the registry would not start"));
      feed.appendChild(findings(report.errors, "", ""));
    }
    feed.appendChild(head("Warnings — saved is not the same as certain"));
    feed.appendChild(findings((master.report || {}).warnings || [], " warn",
      "no warnings: every declared meter, model id and window matched what the machine reports"));
    if (report.errors && report.errors.length && masterBlocked) {
      feed.appendChild(el("p", "note",
        "the fields above still hold what you typed; nothing was written to config."));
    }
  }

  function render() {
    if (view === "dashboard") {
      var waiting = !ap;
      document.getElementById("title").textContent = "Command center";
      document.getElementById("crumb").textContent = "Dashboard";
      document.getElementById("tabs").style.display = "none";
      document.getElementById("stats").textContent = "";
      document.getElementById("sub").textContent = waiting
        ? "membaca PostgreSQL lewat /api/autopilot…"
        : "fokus: " + (((ap.workspace || {}).focus) || "tidak terbaca")
          + " · mode " + (((ap.autopilot || {}).mode) || "?")
          + " · tangan " + (((ap.drain || {}).level) || "?")
          + " · segarkan sendiri setiap 10 detik";
      if (waiting) {
        var f = document.getElementById("feed");
        f.textContent = "";
        f.appendChild(el("p", "empty", "loading…"));
        loadAutopilot();
      }
      return renderDashboard();
    }
    if (view === "decide") { return renderDecideView(); }
    if (view === "treasury") { return renderTreasuryView(); }
    if (view === "roles") {
      /* Jangan membangun ulang formulir yang sedang diketik: poll 10 detik akan
         merebut fokus di tengah nama model. */
      if (document.querySelector("#feed input:focus, #feed select:focus")) { return; }
      return renderRolesView();
    }
    renderStats();
    var titles = { feed: ["What happened", "Activity feed"], files: ["Artefacts", "Files touched"] };
    document.getElementById("title").textContent = titles[view][0];
    document.getElementById("crumb").textContent = titles[view][1];
    document.getElementById("tabs").style.display = view === "feed" ? "" : "none";

    var open = (data.posts || []).filter(function (p) { return p.state === "IN_PROGRESS"; }).length;
    document.getElementById("sub").textContent =
      (data.totals.posts || 0) + " entries today" +
      (open ? " · " + open + " running right now" : "") +
      " · showing the last " + (data.posts || []).length + " from the action log";

    var feed = document.getElementById("feed");
    feed.textContent = "";
    if (view === "files") { renderFiles(); }
    else {
      var shown = (data.posts || []).filter(passes);
      if (!shown.length) feed.appendChild(el("p", "empty", "Nothing matches this filter."));
      else shown.forEach(function (p) { feed.appendChild(renderPost(p)); });
    }
    document.getElementById("stamp").textContent =
      "refreshed " + new Date().toLocaleTimeString() + " · source " + (data.generated_at || "—");
  }

  function load() {
    fetch("/api/station?limit=80", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.error) {
          document.getElementById("feed").textContent = "";
          document.getElementById("feed").appendChild(el("p", "empty", json.error));
          return;
        }
        data = json;
        render();
        if (view === "treasury") loadTreasury();
        if (view === "decide" || view === "dashboard") loadAutopilot();
      })
      .catch(function () {
        document.getElementById("sub").textContent =
          "daemon unreachable — is irsofka-ai-workstation running?";
      });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (chip) {
    chip.addEventListener("click", function () {
      document.querySelector(".chip.on").classList.remove("on");
      chip.classList.add("on");
      filter = chip.dataset.f;
      render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".nav[data-view]"), function (item) {
    item.addEventListener("click", function () {
      document.querySelector(".nav.on").classList.remove("on");
      item.classList.add("on");
      view = item.dataset.view;
      /* Hash ditulis kembali. Sebelum ini halaman hanya MEMBACA hash sekali saat buka, jadi
         berpindah tab lalu me-reload mengembalikan kamu ke Activity feed — dan sebuah tombol
         Back yang tidak pernah ke mana-mana. */
      try { location.hash = "#" + view; } catch (e) { /* WebView menolak: bukan kesalahan data */ }
      window.scrollTo(0, 0);
      render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".nav.soon"), function (item) {
    item.addEventListener("click", function () {
      item.querySelector("em").textContent = "F8 pending";
      setTimeout(function () { item.querySelector("em").textContent = "soon"; }, 1600);
    });
  });
  document.getElementById("q").addEventListener("input", function (e) {
    query = e.target.value.toLowerCase();
    render();
  });

  // Deep link: /station#dashboard, #roles, #treasury, ... — sebuah view bisa dibuka dan diuji
  // tanpa harus mengklik, dan tautan dari terminal mendarat di tempat yang dimaksud.
  function goto(wanted) {
    /* #decide tetap hidup: bookmark lama tidak boleh mati karena sebuah tab dinamai ulang. */
    if (wanted === "decide") { wanted = "dashboard"; }
    var link = document.querySelector('.nav[data-view="' + wanted + '"]');
    if (!link) { return false; }
    var on = document.querySelector(".nav.on");
    if (on) { on.classList.remove("on"); }
    link.classList.add("on");
    view = wanted;
    render();
    if (wanted === "decide" || wanted === "dashboard") { loadAutopilot(); }
    return true;
  }
  goto((location.hash || "").replace(/^#/, ""));
  window.addEventListener("hashchange", function () {
    goto((location.hash || "").replace(/^#/, ""));
  });

  setInterval(function () { if (!document.hidden) load(); }, 10000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
