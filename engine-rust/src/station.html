<!DOCTYPE html>
<!--
  station.html — the human-facing record of the workstation: what was asked, what was done, what came out.
  Read-only by design. Every number here is derived by PostgreSQL from the action log, so nothing on this
  page was typed by an AI describing its own work. Data comes from /api/station; the console stays at /.
  Layout borrows from a game wiki: grouped sidebar, tabbed feed, cards that open into evidence.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irsofka AI Station</title>
<style>
  :root {
    --bg: #0a0e13;
    --rail: #0d131b;
    --panel: #121a24;
    --panel-2: #17212e;
    --line: #202d3c;
    --ink: #e6edf3;
    --ink-dim: #8b9bb0;
    --ink-faint: #5b6a7f;
    --accent: #4fd1c5;
    --amber: #f0b429;
    --rose: #f2617a;
    --violet: #a78bfa;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 236px 1fr;
  }

  /* ---------- sidebar ---------- */
  aside {
    background: linear-gradient(180deg, #101823 0%, var(--rail) 100%);
    border-right: 1px solid var(--line);
    padding: 22px 0 28px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { padding: 0 20px 18px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font: 600 17px/1.2 var(--serif); letter-spacing: 2.4px; text-transform: uppercase; }
  .brand p { margin: 6px 0 0; font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-faint); }
  .group { padding: 20px 12px 0; }
  .group > h2 {
    margin: 0 8px 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .nav {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; border-left: 2px solid transparent; border-radius: 0 8px 8px 0;
    color: var(--ink-dim); padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .nav:hover { color: var(--ink); background: #141d29; }
  .nav.on { color: var(--ink); background: #16212e; border-left-color: var(--accent); }
  .nav.soon { color: var(--ink-faint); cursor: default; }
  .nav.soon:hover { background: none; color: var(--ink-faint); }
  .nav i { font-style: normal; width: 18px; text-align: center; opacity: .85; }
  .nav em {
    margin-left: auto; font-style: normal; font-size: 9.5px; letter-spacing: .8px;
    text-transform: uppercase; color: var(--ink-faint); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px;
  }

  /* ---------- main ---------- */
  main { padding: 0 30px 70px; min-width: 0; }
  header { padding: 30px 0 16px; border-bottom: 1px solid var(--line); }
  .crumb { font-size: 12px; color: var(--ink-faint); letter-spacing: .4px; }
  .crumb b { color: var(--ink-dim); font-weight: 500; }
  h2.title { margin: 12px 0 4px; font: 600 26px/1.15 var(--serif); letter-spacing: .3px; }
  .sub { margin: 0; color: var(--ink-dim); font-size: 13px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 13px; min-width: 76px; }
  .stat span { display: block; font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .7px; }
  .stat strong { display: block; font-size: 18px; font-weight: 600; font-family: var(--mono); }
  .stat.bad strong { color: var(--rose); }
  .stat.good strong { color: var(--accent); }

  nav.tabs {
    display: flex; flex-wrap: wrap; gap: 7px; align-items: center; padding: 16px 0 18px;
    position: sticky; top: 0; z-index: 5;
    background: rgba(10,14,19,.93); backdrop-filter: blur(8px);
  }
  .chip {
    background: var(--panel); color: var(--ink-dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-faint); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #06202a; font-weight: 600; }
  #q {
    margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); padding: 6px 11px; font-size: 13px; min-width: 210px;
  }
  #q:focus { outline: none; border-color: var(--accent); }

  /* ---------- cards ---------- */
  #feed { display: flex; flex-direction: column; gap: 11px; }
  article {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: grid; grid-template-columns: 74px 1fr; gap: 16px; cursor: pointer;
  }
  article:hover { border-color: #2e4054; background: var(--panel-2); }
  article.live { border-left: 2px solid var(--accent); }
  article.fail { border-left: 2px solid var(--rose); }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
  .when em { display: block; font-style: normal; color: var(--ink-dim); margin-top: 3px; }
  .ask { margin: 0 0 9px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); background: #0d141d;
         border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .tag.state { color: var(--accent); border-color: #1d4b48; }
  .tag.state.open { color: var(--amber); border-color: #4a3a13; }
  .tag.bad { color: var(--rose); border-color: #4d2230; }
  .tag.model { color: var(--violet); border-color: #322a4d; }
  .hint { color: var(--ink-faint); font-size: 11px; margin-left: auto; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .file { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); background: #0d141d;
          border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .file.media { color: var(--amber); border-color: #4a3a13; }
  .file i { font-style: normal; color: var(--ink-faint); }

  .detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  article.open { background: var(--panel-2); }
  article.open .detail { display: block; }
  .detail h4 {
    margin: 0 0 7px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px;
    color: var(--ink-faint); font-weight: 700;
  }
  .answer { font-size: 14px; background: #0d141d; border-left: 2px solid var(--accent);
            border-radius: 0 8px 8px 0; padding: 10px 13px; margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; }
  .answer i { display: block; font-style: normal; color: var(--ink-faint); font-size: 11px; margin-top: 7px; }
  .step { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); padding: 2.5px 0;
          white-space: pre-wrap; word-break: break-word; }
  .step b { color: var(--ink-faint); font-weight: 400; margin-right: 9px; }
  .more { color: var(--ink-faint); font-size: 12px; margin-top: 5px; }

  /* ---------- artefacts view ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 11px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
  .box h3 { margin: 0 0 3px; font: 500 14px/1.35 var(--mono); word-break: break-all; }
  .box p { margin: 0; font-size: 12px; color: var(--ink-faint); }
  .box .bar { height: 3px; border-radius: 3px; background: #1b2836; margin-top: 10px; overflow: hidden; }
  .box .bar > i { display: block; height: 100%; background: var(--accent); }
  .box .bar > i.low { background: var(--amber); }
  .box .bar > i.none { background: var(--rose); }
  .box .num { font: 600 20px/1.2 var(--mono); color: var(--ink); margin: 6px 0 2px; }
  .box .num.muted { color: var(--ink-faint); font-size: 15px; font-weight: 500; }
  .box .why { font-size: 11.5px; color: var(--ink-faint); margin-top: 8px; line-height: 1.45; }
  .box .reset { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); margin-top: 8px; }

  /* Roles & verifier (F8.3). Form fields are deliberately narrow: the only values an
     operator may type here are ones the validator can check against a real CLI or meter. */
  .erow { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
  .erow h3 { margin: 0 0 2px; font: 500 14px/1.3 var(--mono); }
  .erow .kind { font-size: 11px; color: var(--ink-faint); margin: 0 0 10px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 9px; }
  .field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .7px;
                 color: var(--ink-faint); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; box-sizing: border-box; background: #0d141d; border: 1px solid var(--line);
    color: var(--ink); font-family: var(--mono); font-size: 12.5px; padding: 6px 8px; border-radius: 7px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .wins { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 3px; }
  .wins label { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); display: flex; gap: 5px; align-items: center; }
  .savebar { display: flex; gap: 10px; align-items: center; margin: 4px 0 2px; flex-wrap: wrap; }
  .btn { background: #0d141d; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 8px;
         padding: 7px 14px; font: 500 12.5px var(--mono); cursor: pointer; }
  .btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06202a; font-weight: 600; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .note { font-size: 12px; color: var(--ink-faint); }
  .findings { display: flex; flex-direction: column; gap: 6px; }
  .finding { border-left: 2px solid var(--rose); background: #0d141d; padding: 8px 11px; border-radius: 0 8px 8px 0;
             font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
  .finding.warn { border-left-color: var(--amber); }
  .finding b { font-family: var(--mono); font-weight: 500; color: var(--ink); display: block; font-size: 11.5px;
               margin-bottom: 3px; word-break: break-all; }
  .rtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .rtable th { text-align: left; font-family: var(--serif); font-size: 10px; font-weight: 500;
               text-transform: uppercase; letter-spacing: .7px;
               color: var(--ink-faint); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
  .rtable td { padding: 7px 10px 7px 0; border-bottom: 1px solid #101a24; vertical-align: top; }
  .rtable td.mono { font-family: var(--mono); font-size: 12px; }
  .rtable td .why { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  .empty { color: var(--ink-faint); text-align: center; padding: 56px 0; font-size: 14px; }
  footer { margin-top: 24px; padding-top: 13px; border-top: 1px solid var(--line);
           color: var(--ink-faint); font-size: 12px; display: flex; justify-content: space-between; gap: 16px; }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>Irsofka</h1>
    <p>AI Station</p>
  </div>
  <div class="group">
    <h2>Today</h2>
    <button class="nav on" data-view="feed"><i>≡</i> Activity feed</button>
    <button class="nav" data-view="files"><i>▤</i> Artefacts</button>
    <button class="nav" data-view="treasury"><i>¤</i> Treasury</button>
  </div>
  <div class="group">
    <h2>Team</h2>
    <button class="nav" data-view="roles"><i>◎</i> Roles &amp; verifier</button>
    <button class="nav soon" data-soon="models"><i>◈</i> Models &amp; VRAM<em>soon</em></button>
  </div>
  <div class="group">
    <h2>System</h2>
    <button class="nav" data-view="decide"><i>✋</i> Human Decide</button>
    <button class="nav soon" data-soon="engines"><i>⚙</i> Engines<em>soon</em></button>
    <button class="nav soon" data-soon="backup"><i>↺</i> Backups<em>soon</em></button>
    <a class="nav" href="/" style="text-decoration:none"><i>▸</i> Open console</a>
  </div>
</aside>

<main>
  <header>
    <div class="crumb">AI Station / <b id="crumb">Activity feed</b></div>
    <h2 class="title" id="title">What happened</h2>
    <p class="sub" id="sub">Loading…</p>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="work">Did work</button>
    <button class="chip" data-f="talk">Talk only</button>
    <button class="chip" data-f="fail">Had failures</button>
    <button class="chip" data-f="open">In progress</button>
    <input id="q" type="search" placeholder="search commands and files…">
  </nav>

  <div id="feed"></div>

  <footer>
    <span>Derived from PostgreSQL. No number on this page was typed by an AI.</span>
    <span id="stamp"></span>
  </footer>
</main>

<script>
(function () {
  "use strict";
  var filter = "all", query = "", view = "feed", data = { posts: [], totals: {} };

  // Setiap view adalah halaman yang berbeda secara mental. Tanpa ini, reload atau deep link
  // (#roles) melanjutkan posisi scroll view sebelumnya dan operator mendarat di tengah
  // laporan tanpa tahu ada apa di atasnya.
  if (window.history && "scrollRestoration" in window.history) {
    window.history.scrollRestoration = "manual";
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function clock(iso) { return iso ? String(iso).slice(11, 16) : ""; }
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  // The feed holds the last 80 entries, which crosses days. Showing a bare clock made
  // yesterday evening read like it had not happened yet.
  function when(iso) {
    var s = String(iso || "");
    if (!s) return "";
    var t = new Date();
    var now = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") +
              "-" + String(t.getDate()).padStart(2, "0");
    if (s.slice(0, 10) === now) return clock(s);
    var mon = MONTHS[(parseInt(s.slice(5, 7), 10) || 1) - 1];
    return (mon || s.slice(5, 7)) + " " + parseInt(s.slice(8, 10), 10) + " · " + clock(s);
  }
  function human(seconds) {
    var s = Number(seconds) || 0;
    if (s < 60) return s + "s";
    if (s < 3600) return Math.round(s / 60) + "m";
    return (s / 3600).toFixed(1) + "h";
  }
  function base(path) { return String(path).split("/").pop() || path; }

  function passes(post) {
    var worked = post.commands > 0 || post.tool_calls > 0;
    if (filter === "work" && !worked) return false;
    if (filter === "talk" && worked) return false;
    if (filter === "fail" && !post.failed) return false;
    if (filter === "open" && post.state !== "IN_PROGRESS") return false;
    if (query) {
      var hay = post.command + " " + (post.artifacts || []).map(function (a) { return a.path; }).join(" ");
      if (hay.toLowerCase().indexOf(query) === -1) return false;
    }
    return true;
  }

  function renderStats() {
    var t = data.totals || {};
    var box = document.getElementById("stats");
    box.textContent = "";
    [["posts", t.posts, ""], ["commands", t.commands, ""], ["tool calls", t.tool_calls, ""],
     ["artefacts", t.artifacts, "good"], ["failed", t.failed, t.failed ? "bad" : ""],
     ["time on task", human(t.work_seconds), ""]].forEach(function (r) {
      var card = el("div", "stat " + r[2]);
      card.appendChild(el("span", null, r[0]));
      card.appendChild(el("strong", null, r[1] === undefined ? "—" : r[1]));
      box.appendChild(card);
    });
  }

  function renderPost(post) {
    var card = el("article", post.state === "IN_PROGRESS" ? "live" : (post.failed ? "fail" : ""));
    var stamp = el("div", "when", when(post.opened_at));
    stamp.appendChild(el("em", null, post.closed_at ? "→ " + when(post.closed_at) : "running"));
    stamp.appendChild(el("em", null, human(post.duration_s)));
    card.appendChild(stamp);

    var body = el("div");
    body.appendChild(el("p", "ask", post.command || "(no text recorded)"));

    var row = el("div", "row");
    row.appendChild(el("span", "tag state " + (post.state === "IN_PROGRESS" ? "open" : ""),
                       post.state === "IN_PROGRESS" ? "in progress" : "done"));
    row.appendChild(el("span", "tag", (post.steps || []).length + " commands"));
    row.appendChild(el("span", "tag", post.tool_calls + " tool"));
    if (post.failed) row.appendChild(el("span", "tag bad", post.failed + " failed"));
    if (post.tab) row.appendChild(el("span", "tag", post.tab));
    if (post.model) row.appendChild(el("span", "tag model", post.model));
    if ((post.steps || []).length || post.outcome) {
      row.appendChild(el("span", "hint", "click to open the evidence"));
    }
    body.appendChild(row);

    var files = post.artifacts || [];
    if (files.length) {
      var box = el("div", "files");
      files.forEach(function (f) {
        var node = el("span", "file " + (f.kind === "media" ? "media" : ""), base(f.path));
        node.title = f.path + "  (" + f.at + (f.edits > 1 ? "…" + f.last + ", " + f.edits + " edits" : "") + ")";
        if (f.edits > 1) node.appendChild(el("i", null, " ×" + f.edits));
        box.appendChild(node);
      });
      body.appendChild(box);
    }

    var detail = el("div", "detail");
    if (post.outcome && post.outcome.text) {
      detail.appendChild(el("h4", null, "What the AI said when it finished"));
      var ans = el("div", "answer", post.outcome.text);
      ans.appendChild(el("i", null, "recorded answer — the transcript holds the rest"));
      detail.appendChild(ans);
    }
    if ((post.steps || []).length) {
      detail.appendChild(el("h4", null, "Commands actually run"));
      post.steps.slice(0, 14).forEach(function (s) {
        var line = el("div", "step");
        line.appendChild(el("b", null, s.at));
        line.appendChild(document.createTextNode(s.cmd));
        detail.appendChild(line);
      });
      if (post.steps.length > 14) {
        detail.appendChild(el("div", "more", "… " + (post.steps.length - 14) + " more in this entry"));
      }
    }
    body.appendChild(detail);
    card.appendChild(body);

    card.addEventListener("click", function (e) {
      if (e.target.closest("a")) return;
      card.classList.toggle("open");
    });
    return card;
  }

  function renderFiles() {
    var seen = {}, list = [];
    (data.posts || []).forEach(function (p) {
      (p.artifacts || []).forEach(function (a) {
        if (!seen[a.path]) { seen[a.path] = { path: a.path, edits: 0, kind: a.kind, last: a.at }; list.push(seen[a.path]); }
        seen[a.path].edits += a.edits || 1;
        if (a.last > seen[a.path].last) seen[a.path].last = a.last;
      });
    });
    list.sort(function (a, b) { return b.edits - a.edits; });
    if (query) list = list.filter(function (f) { return f.path.toLowerCase().indexOf(query) !== -1; });

    var feed = document.getElementById("feed");
    feed.textContent = "";
    if (!list.length) { feed.appendChild(el("p", "empty", "No file was touched in this window.")); return; }
    var grid = el("div", "grid");
    var top = list[0].edits || 1;
    list.slice(0, 60).forEach(function (f) {
      var box = el("div", "box");
      box.appendChild(el("h3", null, base(f.path)));
      box.appendChild(el("p", null, f.edits + (f.edits > 1 ? " edits" : " edit") + " · last " + f.last));
      box.appendChild(el("p", null, f.path.replace(/^\/home\/[^/]+/, "~")));
      var bar = el("div", "bar"), fill = el("i");
      fill.style.width = Math.max(6, Math.round(f.edits / top * 100)) + "%";
      if (f.kind === "media") fill.style.background = "var(--amber)";
      bar.appendChild(fill);
      box.appendChild(bar);
      grid.appendChild(box);
    });
    feed.appendChild(grid);
  }

  var tre = null, treBusy = false;

  function pct(v) { return (Math.round(v * 1000) / 10).toFixed(1) + "%"; }

  function stateTag(state) {
    var cls = state === "REPORTED" ? "tag state" : (state === "UNSUPPORTED" ? "tag" : "tag bad");
    return el("span", cls, state);
  }

  function head(text) {
    var h = el("h4", null, text);
    h.style.cssText = "margin:18px 0 9px;font-size:10.5px;text-transform:uppercase;" +
                      "letter-spacing:1.1px;color:var(--ink-faint);font-weight:700";
    return h;
  }

  /* Satu kartu per pembacaan meter. Baris yang tidak REPORTED justru paling penting:
     kartu itu harus tetap muncul dan menyebut alasannya, karena menghilangkan barisnya
     sama dengan membuat laporan terlihat bersih padahal angkanya tidak ada. */
  function meterBox(r, kind, value, unit) {
    var box = el("div", "box");
    box.appendChild(el("h3", null, kind));
    var row = el("div", "row");
    row.appendChild(el("span", "tag", r.engine));
    row.appendChild(stateTag(r.state));
    box.appendChild(row);

    var num = el("div", "num" + (r.state === "REPORTED" ? "" : " muted"), value);

        first.appendChild(el("b", null, role.role_id));
        if (role.title) {
          var why = el("span", "why");
          why.textContent = role.title;
          first.appendChild(why);
        }
        tr.appendChild(first);
        tr.appendChild(el("td", "mono", resolved.registry_key || "— not bound"));
        var mt = el("td", "mono", resolved.model || (role.model || "—"));
        if (resolved.registry_key && resolved.model) {
          var src = el("span", "why");
          src.textContent = "from config/engines.json → " + resolved.registry_key;
          mt.appendChild(src);
        }
        tr.appendChild(mt);
        var st = el("td", null);
        if (!resolved.registry_key) {
          st.appendChild(el("span", "why", "team description only — this role dispatches nothing"));
        } else if (d && d.can_dispatch) {
          st.appendChild(el("span", "tag state", "yes · " + (d.model || "")));
        } else {
          st.appendChild(el("span", "tag bad", "no"));
          var why2 = el("span", "why");
          why2.textContent = (d && d.reason) || "not in the registry";
          st.appendChild(why2);
        }
        tr.appendChild(st);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      feed.appendChild(table);
    }

    feed.appendChild(head("Engine registry — edit and save"));
    Object.keys(registry).sort().forEach(function (key) {
      feed.appendChild(engineEditor(key, registry[key], live));
    });

    var bar = el("div", "savebar");
    var save = el("button", "btn primary" + (masterBusy ? " waiting" : ""),
      masterBusy ? "working…" : "Save & validate");
    save.disabled = !!masterBusy;
    save.addEventListener("click", saveMaster);
    var reload = el("button", "btn", "Reload from disk");
    reload.disabled = !!masterBusy;
    reload.addEventListener("click", function () {
      master = null; masterMsg = null; masterBlocked = null; loadMaster();
    });
    bar.appendChild(save);
    bar.appendChild(reload);
    if (masterMsg) {
      bar.appendChild(el("span", "note", masterMsg.text));
    }
    feed.appendChild(bar);

    if ((report.errors || []).length) {
      feed.appendChild(head("Refused — the registry would not start"));
      feed.appendChild(findings(report.errors, "", ""));
    }
    feed.appendChild(head("Warnings — saved is not the same as certain"));
    feed.appendChild(findings((master.report || {}).warnings || [], " warn",
      "no warnings: every declared meter, model id and window matched what the machine reports"));
    if (report.errors && report.errors.length && masterBlocked) {
      feed.appendChild(el("p", "note",
        "the fields above still hold what you typed; nothing was written to config."));
    }
  }

  function render() {
    if (view === "decide") { return renderDecideView(); }
    if (view === "treasury") { return renderTreasuryView(); }
    if (view === "roles") {
      /* Jangan membangun ulang formulir yang sedang diketik: poll 10 detik akan
         merebut fokus di tengah nama model. */
      if (document.querySelector("#feed input:focus, #feed select:focus")) { return; }
      return renderRolesView();
    }
    renderStats();
    var titles = { feed: ["What happened", "Activity feed"], files: ["Artefacts", "Files touched"] };
    document.getElementById("title").textContent = titles[view][0];
    document.getElementById("crumb").textContent = titles[view][1];
    document.getElementById("tabs").style.display = view === "feed" ? "" : "none";

    var open = (data.posts || []).filter(function (p) { return p.state === "IN_PROGRESS"; }).length;
    document.getElementById("sub").textContent =
      (data.totals.posts || 0) + " entries today" +
      (open ? " · " + open + " running right now" : "") +
      " · showing the last " + (data.posts || []).length + " from the action log";

    var feed = document.getElementById("feed");
    feed.textContent = "";
    if (view === "files") { renderFiles(); }
    else {
      var shown = (data.posts || []).filter(passes);
      if (!shown.length) feed.appendChild(el("p", "empty", "Nothing matches this filter."));
      else shown.forEach(function (p) { feed.appendChild(renderPost(p)); });
    }
    document.getElementById("stamp").textContent =
      "refreshed " + new Date().toLocaleTimeString() + " · source " + (data.generated_at || "—");
  }

  function load() {
    fetch("/api/station?limit=80", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.error) {
          document.getElementById("feed").textContent = "";
          document.getElementById("feed").appendChild(el("p", "empty", json.error));
          return;
        }
        data = json;
        render();
        if (view === "treasury") loadTreasury();
        if (view === "decide") loadAutopilot();
      })
      .catch(function () {
        document.getElementById("sub").textContent =
          "daemon unreachable — is irsofka-ai-workstation running?";
      });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (chip) {
    chip.addEventListener("click", function () {
      document.querySelector(".chip.on").classList.remove("on");
      chip.classList.add("on");
      filter = chip.dataset.f;
      render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".nav[data-view]"), function (item) {
    item.addEventListener("click", function () {
      document.querySelector(".nav.on").classList.remove("on");
      item.classList.add("on");
      view = item.dataset.view;
      window.scrollTo(0, 0);
      render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".nav.soon"), function (item) {
    item.addEventListener("click", function () {
      item.querySelector("em").textContent = "F8 pending";
      setTimeout(function () { item.querySelector("em").textContent = "soon"; }, 1600);
    });
  });
  document.getElementById("q").addEventListener("input", function (e) {
    query = e.target.value.toLowerCase();
    render();
  });

  // Deep link: /station#roles, #treasury, ... — sebuah view bisa dibuka dan diuji tanpa
  // harus mengklik, dan tautan dari terminal mendarat di tempat yang dimaksud.
  var wanted = (location.hash || "").replace(/^#/, "");
  if (wanted) {
    var link = document.querySelector('.nav[data-view="' + wanted + '"]');
    if (link) {
      document.querySelector(".nav.on").classList.remove("on");
      link.classList.add("on");
      view = wanted;
    }
  }

  setInterval(function () { if (!document.hidden) load(); }, 10000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
